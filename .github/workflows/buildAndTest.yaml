  macos:
    runs-on: macos-latest
    strategy:
      matrix:
        go-version: [1.26.x]
        with-cjson: [0, 1]
        with-yaml: [0, 1]
        exclude:
          - with-cjson: 1
            with-yaml: 1 # Avoid building both for now
    steps:
    - name: Install Go
      uses: actions/setup-go@v3
      with:
        go-version: ${{ matrix.go-version }}
    - name: prerequisites # macos speicific
      run: brew install pkg-config check
    - name: Install cJSON (if needed)
      if: matrix.with-cjson == 1
      run: brew install cjson
    - name: Install YAML (if needed)
      if: matrix.with-yaml == 1
      run: brew install libyaml
    - name: Checkout code
      uses: actions/checkout@v3
    - name: Test
      env:
        GO111MODULE: on
      run: go test -cover ./...
    - name: Build
      run: go build
    - name: Examples test
      run: make test all WITH_CJSON=${{matrix.with-cjson}} WITH_YAML=${{matrix.with-yaml}}

  windows:
    runs-on: windows-latest
    strategy:
      matrix:
        go-version: [1.26.x]
        with-cjson: [0, 1]
        with-yaml: [0, 1]
        sys: [mingw64]
        env: [x86_64]
        exclude:
          - with-cjson: 1
            with-yaml: 1 # Avoid building both for now
    defaults:
      run:
        shell: msys2 {0}
    steps:
    - name: Install Go
      uses: actions/setup-go@v3
      with:
        go-version: ${{ matrix.go-version }}
    - name: prerequisites # Windows speicific
      uses: msys2/setup-msys2@v2 
      with:
        msystem: ${{matrix.sys}}
        update: true
        install: base-devel git pkg-config mingw-w64-${{matrix.env}}-check mingw-w64-${{matrix.env}}-toolchain
        path-type: inherit # to be able to find go in PATH
    - name: Install cJSON (if needed)
      if: matrix.with-cjson == 1
      run: pacman -S --noconfirm mingw-w64-${{matrix.env}}-cjson
    - name: Install YAML (if needed)
      if: matrix.with-yaml == 1
      run: pacman -S --noconfirm mingw-w64-${{matrix.env}}-libyaml
    - name: Checkout code
      uses: actions/checkout@v3
    - name: Test
      env:
        GO111MODULE: on
      run: go test -cover ./...
    - name: Build
      run: go build
    - name: Examples test
      run: make test all WITH_CJSON=${{matrix.with-cjson}} WITH_YAML=${{matrix.with-yaml}}
