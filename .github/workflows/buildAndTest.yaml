on: [push, pull_request]
name: BuildAndTest
jobs:
  ubuntu:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { go-version: 1.26.x, dwarf-version: 5, with-cjson: 0, with-yaml: 0 }
          - { go-version: 1.26.x, dwarf-version: 5, with-cjson: 1, with-yaml: 0 }
          - { go-version: 1.26.x, dwarf-version: 5, with-cjson: 0, with-yaml: 1 }
          - { go-version: 1.26.x, dwarf-version: 4, with-cjson: 0, with-yaml: 0 }
          - { go-version: 1.26.x, dwarf-version: 3, with-cjson: 0, with-yaml: 0 }
    steps:
    - name: Install Go
      uses: actions/setup-go@v3
      with:
        go-version: ${{ matrix.go-version }}
    - name: prerequisites # ubuntu speicific
      run: sudo apt-get install -y check
    - name: Install cJSON (if needed)
      if: matrix.with-cjson == 1
      run: sudo apt-get install -y libcjson-dev
    - name: Install YAML (if needed)
      if: matrix.with-yaml == 1
      run: sudo apt-get install -y libyaml-dev
    - name: Checkout code
      uses: actions/checkout@v3
    - name: Test
      env:
        GO111MODULE: on
      run: go test -cover ./...
    - name: Build
      run: go build
    - name: Examples test
      run: make test all DWARF_VER_FORCE=${{matrix.dwarf-version}} WITH_CJSON=${{matrix.with-cjson}} WITH_YAML=${{matrix.with-yaml}}

